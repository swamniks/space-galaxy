<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Galaxy System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        #webcam-feed { position: absolute; visibility: hidden; }
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: #00ffff;
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 12px;
            border: 1px solid #00ffff; pointer-events: none; z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        .status { color: #fff; font-size: 0.85em; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <strong style="font-size: 1.1em;">Hand Commands:</strong><br>
        • Move Hand: Navigate Space<br>
        • Pinch (Thumb + Index): 🎇 FIREWORK<br>
        • Open/Close Palm: Resize System<br>
        • Make a Fist: Switch Shape<br>
        <div class="status" id="cam-status">Status: Initializing System...</div>
    </div>

    <video id="webcam-feed" playsinline></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        let scene, camera, renderer, mainParticles;
        let fireworks = [];
        const TOTAL_STARS = 15000;
        let shapeIndex = 0;
        let scaleFactor = 1.0;
        let lastShapeChange = 0;
        let canLaunchFirework = true;

        const videoElement = document.getElementById('webcam-feed');
        const statusDisplay = document.getElementById('cam-status');

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            buildShape();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function generateGeometry(id, count) {
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                if (id === 0) { // SPHERE CLOUD
                    const r = 2.2, theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                    const d = Math.pow(Math.random(), 0.5) * r;
                    positions[i*3] = d * Math.sin(phi) * Math.cos(theta);
                    positions[i*3+1] = d * Math.sin(phi) * Math.sin(theta);
                    positions[i*3+2] = d * Math.cos(phi);
                } 
                else if (id === 1) { // TORUS KNOT
                    const t = (i / count) * Math.PI * 2 * 10;
                    const p = 2, q = 3;
                    const r = 0.6 * (2 + Math.sin(q * t));
                    positions[i*3] = r * Math.cos(p * t);
                    positions[i*3+1] = r * Math.cos(q * t);
                    positions[i*3+2] = r * Math.sin(p * t);
                } 
                else { // GALAXY SPIRAL
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 4;
                    const spinAngle = radius * 1.5;
                    const branchAngle = (i % 3) * ((Math.PI * 2) / 3);
                    const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3;
                    const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3;
                    positions[i*3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                    positions[i*3+1] = randomY;
                    positions[i*3+2] = Math.sin(branchAngle + spinAngle) * radius;
                }
                colors[i*3] = 0; colors[i*3+1] = 0.9; colors[i*3+2] = 1;
            }
            return { positions, colors };
        }

        function buildShape() {
            if (mainParticles) scene.remove(mainParticles);
            const data = generateGeometry(shapeIndex, TOTAL_STARS);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(data.colors, 3));
            const mat = new THREE.PointsMaterial({ size: 0.025, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
            mainParticles = new THREE.Points(geo, mat);
            scene.add(mainParticles);
        }

        function spawnFirework(x, y) {
            const count = 400;
            const geo = new THREE.BufferGeometry();
            const p = new Float32Array(count * 3), v = new Float32Array(count * 3), c = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                p[i*3]=x; p[i*3+1]=y; p[i*3+2]=0;
                const speed = 0.08 + Math.random() * 0.12;
                const theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                v[i*3] = speed * Math.sin(phi) * Math.cos(theta);
                v[i*3+1] = speed * Math.sin(phi) * Math.sin(theta);
                v[i*3+2] = speed * Math.cos(phi);
                c[i*3]=1; c[i*3+1]=0.5; c[i*3+2]=0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(c, 3));
            const fw = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending }));
            fw.userData = { v, life: 1.0 };
            scene.add(fw); fireworks.push(fw);
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
        hands.onResults((res) => {
            if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) return;
            const lm = res.multiHandLandmarks[0];
            mainParticles.position.x += ((lm[8].x - 0.5) * -12 - mainParticles.position.x) * 0.1;
            mainParticles.position.y += ((lm[8].y - 0.5) * -10 - mainParticles.position.y) * 0.1;
            scaleFactor = Math.sqrt(Math.pow(lm[4].x-lm[20].x,2) + Math.pow(lm[4].y-lm[20].y,2)) * 4;

            const pinchDist = Math.sqrt(Math.pow(lm[8].x-lm[4].x, 2) + Math.pow(lm[8].y-lm[4].y, 2));
            if (pinchDist < 0.035 && canLaunchFirework) {
                spawnFirework(mainParticles.position.x, mainParticles.position.y);
                canLaunchFirework = false; setTimeout(() => canLaunchFirework = true, 500);
            }
            if (lm[12].y > lm[10].y && Date.now() - lastShapeChange > 1200) {
                shapeIndex = (shapeIndex + 1) % 3; buildShape(); lastShapeChange = Date.now();
            }
        });

        async function startSystem() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    statusDisplay.innerText = "Status: Tracking Active";
                    new Camera(videoElement, { onFrame: async () => await hands.send({ image: videoElement }), width: 640, height: 480 }).start();
                };
            } catch (e) { statusDisplay.innerText = "Status: Check Browser Permissions"; }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (mainParticles) { mainParticles.scale.setScalar(scaleFactor); mainParticles.rotation.y += 0.006; }
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const f = fireworks[i]; const pos = f.geometry.attributes.position.array; const vel = f.userData.v;
                f.userData.life -= 0.02; f.material.opacity = f.userData.life;
                for (let j = 0; j < pos.length; j++) { pos[j] += vel[j]; if (j % 3 === 1) vel[j] -= 0.0015; }
                f.geometry.attributes.position.needsUpdate = true;
                if (f.userData.life <= 0) { scene.remove(f); fireworks.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        initThree(); animate(); startSystem();
    </script>
</body>
</html>
